<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAMACCA VS TOACCA — 3D Edu Racing Challenge</title>
    <meta name="description" content="Game edukasi balap motor 3D interaktif dua pemain untuk siswa SMP dengan materi Konsep dan Analisis Data Terstruktur." />
    <meta property="og:title" content="LAMACCA VS TOACCA — 3D Edu Racing Challenge" />
    <meta property="og:description" content="Game edukasi balap motor 3D interaktif dua pemain untuk siswa SMP dengan materi Konsep dan Analisis Data Terstruktur." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#070D19] text-[#F8FAFC] antialiased selection:bg-[#0EA5E9]/30 selection:text-white overflow-hidden">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      window.setTimeout(function () {
        if (!window.__LAMACCA_TOACCA_MOUNTED__ && /\.github\.io$/i.test(window.location.hostname)) {
          document.body.style.backgroundColor = '#070D19';
          document.body.style.color = '#F8FAFC';
          document.body.style.fontFamily = 'system-ui, sans-serif';
          document.body.style.display = 'flex';
          document.body.style.alignItems = 'center';
          document.body.style.justifyContent = 'center';
          document.body.style.minHeight = '100vh';
          document.body.style.margin = '0';
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML =
              '<div style="max-width:560px;padding:24px;border-radius:16px;background:#0F172A;border:1px solid #38BDF8">' +
              '<h2 style="margin:0 0 10px;color:#38BDF8;font-size:18px">LAMACCA VS TOACCA — Pengaturan GitHub Pages</h2>' +
              '<p style="margin:0 0 12px;font-size:14px;line-height:1.55;color:#E2E8F0">Halaman ini masih membaca kode sumber mentah dari branch <b>main</b>. Agar game 3D langsung berjalan di GitHub Pages:</p>' +
              '<ol style="margin:0;padding-left:20px;font-size:14px;line-height:1.65;color:#F8FAFC">' +
              '<li>Buka repositori GitHub Anda → klik menu <b>Settings</b> → <b>Pages</b>.</li>' +
              '<li>Pada bagian <b>Build and deployment → Source</b>, ubah dari <i>Deploy from a branch</i> menjadi <b>GitHub Actions</b> (atau pilih branch <b>gh-pages</b>).</li>' +
              '<li>Tunggu sekitar 45 detik lalu muat ulang (Refresh) halaman ini.</li>' +
              '</ol></div>';
          }
        }
      }, 2500);
    </script>
  </body>
</html>
