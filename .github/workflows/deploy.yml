name: Deploy Game 3D ke GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode sumber
        uses: actions/checkout@v4

      - name: Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instal dependensi
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build aplikasi statis 3D (Vite + Three.js)
        run: npm run build

      - name: Pastikan file .nojekyll tersedia di dist
        run: touch ./dist/.nojekyll

      - name: Simpan artefak GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publikasikan juga ke branch gh-pages
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
